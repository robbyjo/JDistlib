name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21, 25]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew check --no-daemon

  java8-jar-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the Java 8-compatible core and unified JARs
        run: ./gradlew jar :jdistlib-all:jar :jdistlib-all:compileAllJarSmoke --no-daemon
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 8
      - name: Compile and run against the packaged JAR on Java 8
        run: |
          mkdir -p build/java8-smoke
          JAR="$(find build/libs -maxdepth 1 -type f -name 'jdistlib-*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR"
          javac -cp "$JAR" \
            -d build/java8-smoke examples/Java8JarSmoke.java
          java -cp "$JAR:build/java8-smoke" \
            examples.Java8JarSmoke
          ALL_JAR="$(find distribution/all/build/libs -maxdepth 1 -type f \
            -name 'jdistlib-all-*.jar' -print -quit)"
          test -n "$ALL_JAR"
          java -cp "$ALL_JAR:distribution/all/build/all-jar-smoke" \
            jdistlib.distribution.AllJarSmoke
