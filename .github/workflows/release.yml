name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          TAG="${REQUESTED_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build and test release artifacts
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          ./gradlew clean build :jdistlib-nativecpu:build :jdistlib-cuda:build :jdistlib-opencl:build \
            :jdistlib-vulkan:build :jdistlib-all:build \
            --no-daemon -PreleaseVersion="$VERSION"
          test -f "build/libs/jdistlib-$VERSION.jar"
          unzip -p "build/libs/jdistlib-$VERSION.jar" META-INF/MANIFEST.MF |
            grep -F "Implementation-Version: $VERSION"
          for MODULE in nativecpu cuda opencl vulkan; do
            test -f "accelerators/$MODULE/build/libs/jdistlib-$MODULE-$VERSION.jar"
            unzip -p "accelerators/$MODULE/build/libs/jdistlib-$MODULE-$VERSION.jar" META-INF/MANIFEST.MF |
              grep -F "Implementation-Version: $VERSION"
          done
          ALL_JAR="distribution/all/build/libs/jdistlib-all-$VERSION.jar"
          test -f "$ALL_JAR"
          unzip -p "$ALL_JAR" META-INF/MANIFEST.MF |
            grep -F "Implementation-Version: $VERSION"
          unzip -p "$ALL_JAR" META-INF/services/jdistlib.accelerator.ComputeBackend |
            grep -F 'jdistlib.accelerator.cuda.CudaComputeBackend'
          unzip -p "$ALL_JAR" META-INF/services/jdistlib.accelerator.ComputeBackend |
            grep -F 'jdistlib.accelerator.opencl.OpenClComputeBackend'
          unzip -p "$ALL_JAR" META-INF/services/jdistlib.accelerator.ComputeBackend |
            grep -F 'jdistlib.accelerator.vulkan.VulkanComputeBackend'
          unzip -p "$ALL_JAR" META-INF/services/jdistlib.accelerator.ComputeBackend |
            grep -F 'jdistlib.accelerator.nativecpu.OneMklComputeBackend'
          unzip -p "$ALL_JAR" META-INF/services/jdistlib.accelerator.ComputeBackend |
            grep -F 'jdistlib.accelerator.nativecpu.OpenBlasComputeBackend'
          mkdir -p build/release-assets
          cp "$ALL_JAR" build/release-assets/
          cp "$ALL_JAR" build/release-assets/jdistlib-all.jar
          if find build/release-assets -maxdepth 1 -name '*SNAPSHOT*' | grep -q .; then
            echo "SNAPSHOT artifact found in release output" >&2
            exit 1
          fi
      - name: Create SHA-256 checksums
        working-directory: build/release-assets
        run: sha256sum *.jar > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "JDistlib $VERSION" \
              --notes-file RELEASE_NOTES.md \
              --latest
          else
            gh release create "$TAG" \
              --title "JDistlib $VERSION" \
              --notes-file RELEASE_NOTES.md \
              --verify-tag \
              --latest
          fi
          gh release upload "$TAG" build/release-assets/* --clobber
