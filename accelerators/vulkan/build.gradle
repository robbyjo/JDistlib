plugins { id 'java-library'; id 'maven-publish'; id 'signing' }

group = rootProject.group
version = rootProject.version

repositories { mavenCentral() }

base { archivesName = 'jdistlib-vulkan' }

java {
    withSourcesJar()
    withJavadocJar()
}

def lwjglVersion = '3.3.6'
def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def architecture = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
def nativeClassifier = osName.contains('win')
    ? (architecture.contains('aarch64') || architecture.contains('arm64')
        ? 'natives-windows-arm64' : 'natives-windows')
    : (osName.contains('mac') || osName.contains('darwin'))
        ? (architecture.contains('aarch64') || architecture.contains('arm64')
            ? 'natives-macos-arm64' : 'natives-macos')
        : (architecture.contains('aarch64') || architecture.contains('arm64')
            ? 'natives-linux-arm64' : 'natives-linux')

dependencies {
    api project(':')
    implementation "org.lwjgl:lwjgl:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-vulkan:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-shaderc:${lwjglVersion}"
    runtimeOnly "org.lwjgl:lwjgl:${lwjglVersion}:${nativeClassifier}"
    runtimeOnly "org.lwjgl:lwjgl-shaderc:${lwjglVersion}:${nativeClassifier}"
    if (nativeClassifier.startsWith('natives-macos'))
        runtimeOnly "org.lwjgl:lwjgl-vulkan:${lwjglVersion}:${nativeClassifier}"
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 8
    def disabledLint = ['options']
    if (JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_20)) disabledLint += 'this-escape'
    options.compilerArgs += ["-Xlint:all,-${disabledLint.join(',-')}", '-Werror']
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

jar {
    manifest {
        attributes(
            'Implementation-Title': 'JDistlib Vulkan accelerator',
            'Implementation-Version': project.version
        )
    }
}

test { useJUnit() }

tasks.register('vulkanSmoke', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'jdistlib.accelerator.vulkan.VulkanSmoke'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'jdistlib-vulkan'
            pom {
                name = 'JDistlib Vulkan accelerator'
                description = 'Optional LWJGL Vulkan FP64 compute provider for JDistlib.'
                url = 'https://robbyjo.github.io/JDistlib/'
                licenses { license { name = 'GNU General Public License, version 2 or later'; url = 'https://www.gnu.org/licenses/old-licenses/gpl-2.0.html'; distribution = 'repo' } }
                developers { developer { id = 'robbyjo'; name = 'Roby Joehanes' } }
                scm { connection = 'scm:git:https://github.com/robbyjo/JDistlib.git'; developerConnection = 'scm:git:ssh://git@github.com/robbyjo/JDistlib.git'; url = 'https://github.com/robbyjo/JDistlib' }
                withXml {
                    // Native classifiers are selected by the consuming platform,
                    // not frozen to the maintainer machine that stages Central.
                    asNode().dependencies.dependency.findAll { it.classifier.size() > 0 }
                        .each { it.parent().remove(it) }
                }
            }
        }
    }
    repositories { maven { name = 'centralStaging'; url = rootProject.layout.buildDirectory.dir('central-staging').get().asFile.toURI() } }
}

signing {
    def signingKey = providers.gradleProperty('signingKey')
    def signingPassword = providers.gradleProperty('signingPassword')
    if (signingKey.isPresent()) {
        useInMemoryPgpKeys(signingKey.get(), signingPassword.orNull)
        sign publishing.publications.mavenJava
    }
}
