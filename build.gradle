plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

group = 'net.sourceforge.jdistlib'
def releaseLine = '0.9.1'
def requestedReleaseVersion = providers.gradleProperty('releaseVersion').orNull
if (requestedReleaseVersion != null && requestedReleaseVersion != releaseLine) {
    throw new GradleException("releaseVersion ${requestedReleaseVersion} does not match ${releaseLine}")
}
version = requestedReleaseVersion ?: "${releaseLine}-SNAPSHOT"

def projectHomepage = providers.gradleProperty('projectUrl')
    .getOrElse('https://robbyjo.github.io/JDistlib/')
def projectScmUrl = providers.gradleProperty('scmUrl')
    .getOrElse('https://github.com/robbyjo/JDistlib')
def projectScmConnection = providers.gradleProperty('scmConnection')
    .getOrElse('scm:git:https://github.com/robbyjo/JDistlib.git')
def projectScmDeveloperConnection = providers.gradleProperty('scmDeveloperConnection')
    .getOrElse('scm:git:ssh://git@github.com/robbyjo/JDistlib.git')

base {
    archivesName = 'jdistlib'
}

java {
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {
    api 'com.github.wendykierp:JTransforms:3.1'
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 8
    def disabledLintCategories = ['cast', 'options', 'strictfp']
    if (JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_20)) {
        disabledLintCategories += 'this-escape'
    }
    options.compilerArgs += [
        "-Xlint:all,-${disabledLintCategories.join(',-')}",
        '-Werror'
    ]
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.windowTitle = "JDistlib ${project.version} API"
    options.docTitle = "JDistlib ${project.version} API"
    options.header = 'JDistlib API'
    options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.register('site', Sync) {
    dependsOn tasks.named('javadoc')
    from('docs')
    from(tasks.named('javadoc')) {
        into 'api'
    }
    into layout.buildDirectory.dir('site')
}

def releaseDocumentation = files(file('README.md'), fileTree('docs') {
    include '**/*.html', '**/*.md'
})

tasks.register('validateReleaseDocumentation') {
    group = 'verification'
    description = 'Rejects stale version-pinned website downloads and runnable JAR paths.'
    inputs.files(releaseDocumentation, file('.github/workflows/release.yml'))
    doLast {
        def stalePatterns = [
            [label: 'version-pinned GitHub release link', pattern: ~/releases\/(?:download|tag)\/v\d+\.\d+\.\d+/],
            [label: 'version-pinned runnable JAR', pattern: ~/jdistlib(?:-all)?-\d+\.\d+\.\d+(?:-SNAPSHOT)?\.jar/],
            [label: 'version-pinned documentation build', pattern: ~/-PreleaseVersion=\d+\.\d+\.\d+/]
        ]
        releaseDocumentation.files.each { documentation ->
            def text = documentation.getText('UTF-8')
            stalePatterns.each { rule ->
                if ((text =~ rule.pattern).find()) {
                    throw new GradleException("${rule.label} in ${project.relativePath(documentation)}; use releases/latest or a version-independent classpath")
                }
            }
        }
        def latestDownload = 'https://github.com/robbyjo/JDistlib/releases/latest/download/jdistlib-all.jar'
        ['README.md', 'docs/index.html', 'docs/gpu-acceleration.html'].each { name ->
            if (!file(name).getText('UTF-8').contains(latestDownload))
                throw new GradleException("${name} must use the stable latest-release download")
        }
        def homePage = file('docs/index.html').getText('UTF-8')
        if (!homePage.contains("data-latest-release-version>${releaseLine}<"))
            throw new GradleException('homepage release-number fallback must match the release line')
        if (!file('docs/assets/latest-release.js').getText('UTF-8').contains(
                'repos/robbyjo/JDistlib/releases/latest'))
            throw new GradleException('homepage release number must query the latest GitHub release')
        if (!file('.github/workflows/release.yml').getText('UTF-8').contains(
                'build/release-assets/jdistlib-all.jar'))
            throw new GradleException('release workflow must publish the stable jdistlib-all.jar alias')
    }
}

def validateDistributionCatalog = tasks.register('validateDistributionCatalog') {
    group = 'verification'
    description = 'Checks that every distribution-catalog row has balanced MathJax and current summary counts.'
    inputs.file('docs/distributions.html')
    doLast {
        def catalog = file('docs/distributions.html').getText('UTF-8')
        def allRows = catalog.readLines().findAll { it.contains('<tr><td><a') }
        def malformed = []
        allRows.each { row ->
            def cells = row.split('</td>', -1)
            if (cells.length < 4) {
                malformed << 'unparseable catalog row'
            } else {
                def name = (cells[0] =~ /<code>([^<]+)<\/code>/)
                def label = name.find() ? name.group(1) : 'unnamed row'
                def formula = cells[2]
                if (!formula.contains('\\(') || !formula.contains('\\)') ||
                        formula.count('\\(') != formula.count('\\)'))
                    malformed << label
            }
        }
        if (!malformed.isEmpty())
            throw new GradleException("catalog rows need balanced MathJax formulae: ${malformed.join(', ')}")

        def rowsBetween = { start, end ->
            def from = catalog.indexOf("id=\"${start}\"")
            def to = end == null ? catalog.length() : catalog.indexOf("id=\"${end}\"", from + 1)
            catalog.substring(from, to).readLines().findAll { it.contains('<tr><td><a') }
        }
        def scalarRows = rowsBetween('continuous', 'discrete') + rowsBetween('discrete', 'multivariate')
        def fullDpqr = scalarRows.count { it.contains('class="methods">DPQR') }
        def summaries = [
            "<strong>${allRows.size()}</strong> documented classes",
            "<strong>${fullDpqr}</strong> scalar laws with full D/P/Q/R",
            "<strong>${rowsBetween('multivariate', 'copulas').size()}</strong> vector or matrix laws",
            "<strong>${rowsBetween('copulas', 'statistics').size()}</strong> copula and joint-law classes"
        ]
        summaries.each { summary ->
            if (!catalog.contains(summary))
                throw new GradleException("distribution catalog summary is stale: expected ${summary}")
        }
    }
}

def compileDocumentationExamples = tasks.register('compileDocumentationExamples', JavaCompile) {
    dependsOn tasks.named('jar')
    source fileTree('examples') { include '**/*.java' }
    classpath = files(tasks.named('jar').flatMap { it.archiveFile })
    destinationDirectory = layout.buildDirectory.dir('documentation-examples')
}

def validateModelScripts = tasks.register('validateModelScripts', JavaExec) {
    dependsOn compileDocumentationExamples
    classpath = files(tasks.named('jar').flatMap { it.archiveFile },
        compileDocumentationExamples.flatMap { it.destinationDirectory })
    mainClass = 'examples.ModelScriptCatalog'
    args file('examples/models').absolutePath, file('examples/stan').absolutePath
}

tasks.named('check') {
    dependsOn compileDocumentationExamples, validateModelScripts, validateReleaseDocumentation,
        validateDistributionCatalog,
        ':jdistlib-cuda:check', ':jdistlib-opencl:check', ':jdistlib-vulkan:check',
        ':jdistlib-all:check', 'validateModularPoms'
}

tasks.register('validateModularPoms') {
    group = 'verification'
    description = 'Checks portable Maven coordinates and rejects maintainer-platform native classifiers.'
    dependsOn 'generatePomFileForMavenJavaPublication',
        ':jdistlib-cuda:generatePomFileForMavenJavaPublication',
        ':jdistlib-opencl:generatePomFileForMavenJavaPublication',
        ':jdistlib-vulkan:generatePomFileForMavenJavaPublication'
    doLast {
        def expected = [
            'build/publications/mavenJava/pom-default.xml': '<artifactId>jdistlib</artifactId>',
            'accelerators/cuda/build/publications/mavenJava/pom-default.xml': '<artifactId>jdistlib-cuda</artifactId>',
            'accelerators/opencl/build/publications/mavenJava/pom-default.xml': '<artifactId>jdistlib-opencl</artifactId>',
            'accelerators/vulkan/build/publications/mavenJava/pom-default.xml': '<artifactId>jdistlib-vulkan</artifactId>'
        ]
        expected.each { path, coordinate ->
            String pom = file(path).getText('UTF-8')
            if (!pom.contains(coordinate)) throw new GradleException("unexpected Maven coordinates in ${path}")
            if (pom.contains('<classifier>')) throw new GradleException("platform classifier leaked into ${path}")
        }
    }
}

test {
    useJUnit()
}

jar {
    manifest {
        attributes(
            'Implementation-Title': 'JDistlib',
            'Implementation-Version': project.version
        )
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'jdistlib'
            pom {
                name = 'JDistlib'
                description = 'Thread-safe Java implementations of statistical distributions based on R src/nmath.'
                url = projectHomepage
                licenses {
                    license {
                        name = 'GNU General Public License, version 2 or later'
                        url = 'https://www.gnu.org/licenses/old-licenses/gpl-2.0.html'
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        id = 'robbyjo'
                        name = 'Roby Joehanes'
                    }
                    developer {
                        id = 'danking'
                        name = 'Daniel King'
                    }
                }
                scm {
                    connection = projectScmConnection
                    developerConnection = projectScmDeveloperConnection
                    url = projectScmUrl
                }
            }
        }
    }
    repositories {
        maven {
            name = 'centralStaging'
            url = layout.buildDirectory.dir('central-staging').get().asFile.toURI()
        }
    }
}

signing {
    def signingKey = providers.gradleProperty('signingKey')
    def signingPassword = providers.gradleProperty('signingPassword')
    if (signingKey.isPresent()) {
        useInMemoryPgpKeys(signingKey.get(), signingPassword.orNull)
        sign publishing.publications.mavenJava
    }
}

def centralChecksums = tasks.register('centralChecksums') {
    group = 'publishing'
    description = 'Creates Central Portal checksums for the locally staged publication.'
    dependsOn 'publishMavenJavaPublicationToCentralStagingRepository',
        ':jdistlib-cuda:publishMavenJavaPublicationToCentralStagingRepository',
        ':jdistlib-opencl:publishMavenJavaPublicationToCentralStagingRepository',
        ':jdistlib-vulkan:publishMavenJavaPublicationToCentralStagingRepository'
    doLast {
        def stagingRoot = layout.buildDirectory.dir('central-staging').get().asFile
        fileTree(stagingRoot).matching {
            exclude '**/*.md5', '**/*.sha1', '**/*.sha256', '**/*.sha512'
        }.files.each { artifact ->
            ['MD5': 'md5', 'SHA-1': 'sha1', 'SHA-256': 'sha256',
             'SHA-512': 'sha512'].each { algorithm, suffix ->
                def digest = java.security.MessageDigest.getInstance(algorithm)
                artifact.withInputStream { stream ->
                    byte[] buffer = new byte[8192]
                    for (int count = stream.read(buffer); count >= 0;
                            count = stream.read(buffer)) {
                        if (count > 0) digest.update(buffer, 0, count)
                    }
                }
                new File(artifact.parentFile, "${artifact.name}.${suffix}").text =
                    digest.digest().collect { String.format('%02x', it & 0xff) }.join('')
            }
        }
    }
}

tasks.register('centralBundle', Zip) {
    group = 'publishing'
    description = 'Builds a signed Maven-layout bundle for Central Portal upload.'
    dependsOn centralChecksums
    from layout.buildDirectory.dir('central-staging')
    destinationDirectory = layout.buildDirectory.dir('distributions')
    archiveFileName = "jdistlib-${project.version}-central.zip"
    doFirst {
        if (project.version.toString().endsWith('-SNAPSHOT')) {
            throw new GradleException("centralBundle requires -PreleaseVersion=${releaseLine}")
        }
        if (!providers.gradleProperty('signingKey').isPresent()) {
            throw new GradleException('centralBundle requires an in-memory signingKey')
        }
    }
}
